name: Retire fully integrated branches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: retire-integrated-branches
  cancel-in-progress: false
jobs:
  retire:
    if: github.repository == 'faisalwrokksa-hub/TO' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retire only GitHub branches already entirely contained in main
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            const deleted = [], skipped = [], errors = [];
            // Pin the comparison to a single, reviewed main revision.
            const base = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const mainSha = base.data.commit.sha;
            // Divergent commits can have exactly the same final files as main.
            // Never infer equivalence from commit hashes or merged PR titles.
            const fileAt = async (ref, path) => {
              try {
                const result = await github.rest.repos.getContent({owner, repo, path, ref});
                if (Array.isArray(result.data) || result.data.type !== 'file' || !result.data.sha) return {invalid:true};
                return {sha:result.data.sha};
              } catch (error) {
                if (error.status === 404) return {missing:true};
                throw error;
              }
            };
            const alreadyInMain = async (files, headSha) => {
              // GitHub Compare caps its file array at 300; fail closed if truncated.
              if (!Array.isArray(files) || files.length === 0 || files.length >= 300) return false;
              for (const file of files) {
                if (!['added','modified','removed'].includes(file.status) ||
                    !file.filename || typeof file.filename !== 'string') return false;
                const [mainFile, branchFile] = await Promise.all([
                  fileAt(mainSha,file.filename), fileAt(headSha,file.filename)
                ]);
                if (file.status === 'removed') {
                  if (!mainFile.missing || !branchFile.missing) return false;
                } else if (!mainFile.sha || !branchFile.sha || mainFile.sha !== branchFile.sha) {
                  return false;
                }
              }
              return true;
            };
            for (const branch of branches) {
              if (branch.name === 'main' || branch.protected) { skipped.push(branch.name + ': main/protected'); continue; }
              try {
                const compare = await github.rest.repos.compareCommits({owner, repo, base: mainSha, head: branch.commit.sha});
                let verified = compare.data.ahead_by === 0 ? 'already ancestor of main' : null;
                if (!verified) {
                  const closed = await github.rest.pulls.list({owner, repo, state: 'closed', head: owner + ':' + branch.name, per_page: 100});
                  for (const pr of closed.data) {
                    if (!pr.merged_at || pr.base.ref !== 'main' || pr.head.sha !== branch.commit.sha || !pr.merge_commit_sha) continue;
                    const included = await github.rest.repos.compareCommits({owner, repo, base: 'main', head: pr.merge_commit_sha});
                    if (included.data.ahead_by === 0) { verified = 'merged PR #' + pr.number; break; }
                  }
                }
                if (!verified && await alreadyInMain(compare.data.files, branch.commit.sha)) {
                  verified = 'all branch-changed file blobs identical to main';
                }
                if (!verified) { skipped.push(branch.name + ': unmerged changes'); continue; }
                const prs = await github.rest.pulls.list({owner, repo, state: 'open', head: owner + ':' + branch.name, per_page: 1});
                if (prs.data.length) { skipped.push(branch.name + ': open PR'); continue; }
                const fresh = await github.rest.repos.getBranch({owner, repo, branch: branch.name});
                if (fresh.data.commit.sha !== branch.commit.sha) { skipped.push(branch.name + ': branch changed'); continue; }
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + branch.name});
                deleted.push({branch: branch.name, sha: branch.commit.sha, evidence: verified});
              } catch (error) { errors.push(branch.name + ': ' + error.message); }
            }
            core.info(JSON.stringify({deleted, skipped, errors}, null, 2));
            await core.summary.addHeading('Integrated-branch cleanup')
              .addRaw('Deleted: ' + deleted.length + '; skipped: ' + skipped.length + '; errors: ' + errors.length)
              .write();
            if (errors.length) core.setFailed('Some safe branch cleanup operations failed; see job logs.');
