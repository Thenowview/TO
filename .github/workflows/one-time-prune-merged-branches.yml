# Branch pruning is intentionally unavailable until the stacked PRs have
# been independently verified, merged and a separate deletion plan is approved.
# Historical cleanup logic remains in Git history for review; never auto-delete refs.
name: One-time prune merged TheOrg branches (disabled)
on:
  workflow_dispatch:
    inputs:
      confirm_self_hosted:
        description: 'Run a non-destructive branch cleanup status check only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  review-only:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.confirm_self_hosted }}
    runs-on: [self-hosted, windows, x64, theorg-win]
    timeout-minutes: 5
    steps:
      - name: Confirm branch deletion remains disabled
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          Write-Host 'NO-OP: Branch deletion disabled while PRs #20-#23 are drafts.'
          Write-Host 'No git push/delete, merges, billing changes or deployments performed.'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Branch cleanup is disabled. An explicit independent post-merge review is required.'
