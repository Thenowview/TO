name: GIZE Code Mode security regression

on:
  pull_request:
    paths:
      - 'code-mode/**'
      - 'tests/gize-code-mode*.test.mjs'
      - '.github/workflows/gize-code-mode-security-ci.yml'
  push:
    branches: [main]
    paths:
      - 'code-mode/**'
      - 'tests/gize-code-mode*.test.mjs'
      - '.github/workflows/gize-code-mode-security-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate GIZE Code Mode JavaScript syntax
        run: |
          node --check code-mode/gateway.mjs
          node --check code-mode/native-catalog.mjs
          node --check tests/gize-code-mode.test.mjs
          node --check tests/gize-code-mode-negative.test.mjs
          node --check tests/gize-code-mode-native-catalog.test.mjs
      - name: Verify authorization, isolation and tool-budget regressions
        run: |
          node --test tests/gize-code-mode.test.mjs tests/gize-code-mode-negative.test.mjs tests/gize-code-mode-native-catalog.test.mjs
