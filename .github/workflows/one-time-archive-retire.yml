name: One-time archive and retire historical branches
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: retire-integrated-branches
  cancel-in-progress: false
jobs:
  archive-once:
    if: github.repository == 'faisalwrokksa-hub/TO' && contains(github.event.head_commit.message, '[archive-branches-20261118]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate one-time archive script syntax
        run: node --check scripts/one-time-archive-retire.cjs
      - name: Preserve commit SHA in tags before deleting any historical branch
        uses: actions/github-script@v7
        with:
          script: |
            const task = require('./scripts/one-time-archive-retire.cjs');
            await task({github,context,core});
      - name: Preserve retirement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-branches-evidence-${{ github.run_id }}
          path: branch-retirement-report.json
          if-no-files-found: warn
          retention-days: 90
