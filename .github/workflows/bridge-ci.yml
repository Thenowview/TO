name: TheOrg Chrome and Windows Bridge CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      confirm_self_hosted:
        description: 'Run trusted source on my private Windows runner only'
        type: boolean
        required: true
        default: false
      build_unsigned_windows_candidate:
        description: 'Also build unsigned Windows candidate locally'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  self-hosted-windows-source:
    # Manual dispatch only. Never run untrusted PR code on a persistent private PC.
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.confirm_self_hosted }}
    runs-on: [self-hosted, windows, x64, theorg-win]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout operator-selected trusted branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check preinstalled Windows runner tools (no downloads)
        shell: powershell
        run: |
          ./tools/Test-TheOrg-Runner-Preflight.ps1
      - name: Verify source on local Windows runner
        shell: powershell
        run: |
          ./tools/Test-TheOrg-Source-Local.ps1
      - name: Optional unsigned Windows build on local machine
        if: ${{ inputs.build_unsigned_windows_candidate }}
        shell: powershell
        run: |
          ./tools/Build-TheOrg-Windows-Local.ps1
          ./tools/Build-TheOrg-Windows-Local.ps1 -CheckOnly
      - name: Record verification scope
        if: always()
        shell: powershell
        run: |
          $message = @(
            'Self-hosted Windows check only. No merge or deployment. No GitHub-hosted compute used.',
            'Source tests are not proof of live AI provider execution or a clean-machine install.',
            'If preflight failed, expand the preflight step log and report the exact failing prerequisite.'
          )
          foreach ($line in $message) { Write-Host $line }
          if ($env:GITHUB_STEP_SUMMARY -and (Test-Path -LiteralPath $env:GITHUB_STEP_SUMMARY -PathType Leaf)) {
            foreach ($line in $message) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $line }
          } else {
            Write-Warning 'GITHUB_STEP_SUMMARY unavailable; printed verification scope in logs.'
          }
