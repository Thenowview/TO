name: TheOrg Intelligence site checks
on:
  pull_request:
    paths:
      - 'sites/theorg-intelligence/**'
      - '.github/workflows/theorg-intelligence-check.yml'
  push:
    branches: [main]
    paths:
      - 'sites/theorg-intelligence/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standalone website syntax and boundaries
        run: node sites/theorg-intelligence/verify.mjs
      - name: Enterprise rules and gateway security tests
        run: node --test sites/theorg-intelligence/enterprise.test.mjs
      - name: AI tool studio and task analytics contracts
        run: node --test sites/theorg-intelligence/tool-platform.test.mjs
      - name: Task engine and evidence integration tests
        run: node --test sites/theorg-intelligence/task-engine.test.mjs
      - name: Operations suite analytics and reporting regression
        run: node --test sites/theorg-intelligence/operations-suite.test.mjs
      - name: Local AI advisor opt-in and localhost boundary tests
        run: node --test sites/theorg-intelligence/local-ai-cli.test.mjs
      - name: Local runtime SQLite and authorization regression tests
        run: python3 -m unittest discover -s sites/theorg-intelligence -p 'test_local_*.py' -v
      - name: Local-to-report integration tests
        run: node --test sites/theorg-intelligence/local-report-cli.test.mjs
      - name: Synthetic local end-to-end task, audit and report acceptance
        run: python3 sites/theorg-intelligence/local-e2e.py
      - name: Verify local-import dashboard UI boundaries
        run: node sites/theorg-intelligence/operations-ui.verify.mjs
      - name: Commercial tools execution and storefront safety
        run: |
          node --test sites/theorg-intelligence/commercial-tools.test.mjs
          node sites/theorg-intelligence/marketplace-ui.verify.mjs
      - name: Generate reproducible Cloudflare Worker
        run: |
          node sites/theorg-intelligence/build-worker.mjs
          node sites/theorg-intelligence/verify-worker.mjs
      - name: Verify no forbidden external assets
        shell: bash
        run: |
          test -s sites/theorg-intelligence/index.html
          ! grep -Eiq '<script[^>]+src=|<link[^>]+href=' sites/theorg-intelligence/index.html
