name: TheOrg Runner Diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/theorg-runner-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm runner starts
        run: |
          echo "Runner started"
          echo "OS=$RUNNER_OS"
          echo "GITHUB_SHA=$GITHUB_SHA"
      - name: Check Node exists
        run: node --version
