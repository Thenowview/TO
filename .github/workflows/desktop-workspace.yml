name: GIZE standalone workspace candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the installed .NET 8 SDK explicitly
        shell: pwsh
        run: |
          @{sdk = @{version = '8.0.100'; rollForward = 'latestFeature'}} | ConvertTo-Json | Set-Content global.json
      - name: Test local chat transport and scoped browser adapter
        run: node --test tests/local-chat-client.test.cjs tests/browser-workflow.test.cjs tests/ui-contract.test.cjs
      - name: Compile standalone app without a Chrome extension dependency
        run: dotnet publish apps/desktop/Gize.Desktop.csproj -c Release -o out/desktop
      - name: Publish native host for actual protocol tests
        run: dotnet publish engine/bridge/TheOrg.Bridge.csproj -c Release -r win-x64 --self-contained true -o out/bridge
      - name: Launch actual standalone app and verify job sidebar and isolated embedded profiles
        shell: pwsh
        run: |
          $binary = (Resolve-Path 'out/desktop/Gize.Desktop.exe').Path
          $taskProcess = Start-Process -FilePath $binary -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (!$taskProcess.WaitForExit(90000)) { $taskProcess.Kill(); throw 'Standalone launch test timed out' }
          if (!(Test-Path 'desktop-smoke-result.json')) { throw 'Standalone test receipt missing' }
          Get-Content 'desktop-smoke-result.json'
          if ($taskProcess.ExitCode -ne 0) { throw 'Standalone app launch acceptance failed' }
          $receipt = Get-Content 'desktop-smoke-result.json' -Raw | ConvertFrom-Json
          if (!$receipt.ok) { throw 'Standalone app receipt rejected' }
      - name: Verify chat streaming, duplicate prevention and per-job memory with a synthetic local runtime
        run: python tests/local-chat-smoke.py out/bridge/TheOrg.Bridge.exe
      - name: Build and verify the per-user standalone installer
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          New-Item -ItemType Directory -Force out/installer | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 tools/GizeDesktopPreview.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Standalone installer compilation failed' }
          $installer = (Resolve-Path 'out/installer/GIZE-Desktop-Preview-x64-unsigned.exe').Path
          $taskProcess = Start-Process -FilePath $installer -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($taskProcess.ExitCode -ne 0) { throw 'Standalone installer failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/GIZE/Gize.Desktop.exe'
          if (!(Test-Path $installed)) { throw 'Installed standalone executable missing' }
          $assets = Join-Path (Split-Path $installed) 'assets/desktop-bridge.js'
          if (!(Test-Path $assets)) { throw 'Installed embedded workspace adapter missing' }
          Get-FileHash $installer -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLowerInvariant() + '  GIZE-Desktop-Preview-x64-unsigned.exe' } | Set-Content out/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GIZE-Standalone-UNSIGNED-CANDIDATE
          path: |
            out/desktop/
            out/installer/
            desktop-smoke-result.json
          retention-days: 14
          if-no-files-found: error
