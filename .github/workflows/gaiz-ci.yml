name: GAIZ interoperability candidate tests
on:
  pull_request:
    paths:
      - 'gaiz/**'
      - 'engine/bridge/ArtifactInspection.cs'
      - 'engine/bridge/ArtifactStore.cs'
      - '.github/workflows/gaiz-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reference JS
        run: |
          node --check gaiz/core.mjs
          node --check gaiz/v2.mjs
          node --check gaiz/cli.mjs
          node --test gaiz/*.test.mjs gaiz/conformance/*.test.mjs
      - name: Generate synthetic interoperability evidence (no private keys persisted)
        run: |
          node --check gaiz/generate-interop-evidence.mjs
          node gaiz/generate-interop-evidence.mjs --out="$RUNNER_TEMP/gaiz2-evidence"
          node -e "const r=require(process.env.RUNNER_TEMP+'/gaiz2-evidence/receipt.json'); if(r.results.length!==7 || !r.results.every(x=>x.outcome===x.expected) || r.authorizationGranted!==false || r.importAllowed!==false) process.exit(1)"
          test -s "$RUNNER_TEMP/gaiz2-evidence/trusted-issuer-public.pem"
          test ! -e "$RUNNER_TEMP/gaiz2-evidence/issuer-private.pem"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent Python crypto reader
        run: python -m pip install 'cryptography==46.0.3'
      - name: Cross-language Node producer and Python consumer
        run: |
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          node gaiz/conformance/generate.mjs "$dir"
          python gaiz/conformance/verify_python.py "$dir"
      - name: No committed private key material in GAIZ tree
        run: |
          if grep -r -l -E --include='*.mjs' --include='*.md' -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' gaiz/; then exit 1; fi
