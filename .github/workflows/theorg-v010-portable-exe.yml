name: TheOrg portable Windows release acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_self_hosted:
        description: 'Run trusted source on my private Windows runner only'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: theorg-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.confirm_self_hosted }}
    name: Source tests and fail-closed evidence
    runs-on: [self-hosted, windows, x64, theorg-win]
    timeout-minutes: 12
    defaults:
      run:
        working-directory: offline_desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Python, JavaScript and offline engine on Windows
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath ../theorg-source-ci.log
          if ($LASTEXITCODE -ne 0) { throw 'Offline unit tests failed' }
          python -m compileall -q app.py engine scripts
          if ($LASTEXITCODE -ne 0) { throw 'Offline compile failed' }
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard syntax failed' }
          python app.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Offline self-test failed' }
      - name: Retain source diagnostics even on failed checks
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: TheOrg-source-diagnostics
          path: theorg-source-ci.log
          if-no-files-found: warn
          retention-days: 10
      - name: Summarize source acceptance outcome
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          if (Test-Path ../theorg-source-ci.log) {
            Get-Content ../theorg-source-ci.log -Tail 35 | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY 'Source diagnostics unavailable.'
          }
          Add-Content $env:GITHUB_STEP_SUMMARY 'GGUF inference and Windows release acceptance are separate checks.'
      - name: Explain real-model acceptance gate
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          Write-Host 'Real model acceptance requires a verified llama.cpp runtime and offline Docker image.'
          Write-Host 'These source checks do not prove GGUF inference.'

  portable-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.confirm_self_hosted }}
    name: Build and execute Windows EXE
    needs: source-acceptance
    runs-on: [self-hosted, windows, x64, theorg-win]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: offline_desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Re-run source unit tests on Windows
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows source test failure' }
          python app.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows source self-test failure' }
      - name: Build and smoke-test actual portable EXE
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          ./Build-TheOrg-Portable-Windows.ps1 -SkipTests
          if ($LASTEXITCODE -ne 0) { throw 'Windows EXE builder failed' }
      - name: Independently validate release receipts
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          python scripts/check_release.py dist --report dist/RELEASE-ACCEPTANCE.json
          if ($LASTEXITCODE -ne 0) { throw 'Release acceptance failed' }
      - name: Upload verified release only
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: TheOrg-v0.10-Portable-Windows-EXE
          path: |
            offline_desktop/dist/TheOrg.exe
            offline_desktop/dist/SHA256SUMS.txt
            offline_desktop/dist/UPSTREAM-DIGESTS.txt
            offline_desktop/dist/WINDOWS-SMOKE.json
            offline_desktop/dist/RELEASE-ACCEPTANCE.json
          retention-days: 30
          if-no-files-found: error
      - name: Record failure state without publishing an unverified EXE
        if: failure()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Windows release NOT VERIFIED. Do not distribute a binary from this run.'
          if (Test-Path dist/RELEASE-ACCEPTANCE.json) {
            Get-Content dist/RELEASE-ACCEPTANCE.json | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
