name: TheOrg Supervisor Source Candidate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      confirm_self_hosted:
        description: 'Run trusted source on my private Windows runner only'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  source-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.confirm_self_hosted }}
    runs-on: [self-hosted, windows, x64, theorg-win]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate agents and extension on Windows
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          node --test tests/company-agent-directory.test.cjs tests/provider-capacity.test.cjs tests/supervisor-starters.test.cjs tests/ui-contract.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Node agent tests failed' }
          foreach ($file in @('apps/chrome-extension/company-agent-directory.js','apps/chrome-extension/provider-auto-handoff.js','apps/chrome-extension/provider-page-agent.js','apps/chrome-extension/background.js','apps/chrome-extension/home.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $file" }
          }
      - name: Create hash-verified source candidate locally
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: |
          python tools/package-supervisor-source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed' }
      - name: Upload review-only full source candidate
        uses: actions/upload-artifact@v4
        if: ${{ false }}
        with:
          name: TheOrg-Supervisor-CompanyAgents-SourceOnly
          path: out/source-preview/*
          if-no-files-found: error
          retention-days: 30
